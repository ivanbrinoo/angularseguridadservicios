<div class="container mt-4">

  <!-- Tabla estilizada -->
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover table-striped align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th scope="col" class="ps-3">ID</th>
              <th scope="col">Apellido</th>
              <th scope="col">Oficio</th>
              <th scope="col">ID Departamento</th>
            </tr>
          </thead>
          <tbody>
            @for (empleado of arrayempleados; track empleado.idEmpleado) {
              <tr>
                <td class="ps-3 fw-bold text-secondary">#{{empleado.idEmpleado}}</td>
                <td>{{empleado.apellido}}</td>
                <td>
                  <span class="badge bg-info text-dark">{{empleado.oficio}}</span>
                </td>
                <td>{{empleado.idDepartamento}}</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>
